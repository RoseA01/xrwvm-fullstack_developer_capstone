name: Lint Code

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          echo "Running flake8 on Python files..."
          flake8 . --count --show-source --statistics \
            --max-line-length=120 \
            --ignore=E501,E402,E401,F401,F403,W503,W504 \
            --exclude=venv,env,.venv,__pycache__,migrations,build,dist,.git
          echo "✅ Python linting completed (common issues ignored)."

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run JSHint Linter
        run: |
          echo "Running jshint on JavaScript files..."
          find . -name "*.js" \
            -not -path "./frontend/node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./server/migrations/*" \
            -exec jshint {} + || true
          echo "✅ JavaScript linting completed (warnings allowed)."
