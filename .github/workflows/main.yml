name: Lint Code

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          echo "Running flake8 on all Python files..."
          # Allow common issues and set reasonable max line length
          flake8 . --count --show-source --statistics \
            --max-line-length=120 \
            --ignore=E501,E402,W503,W504,F401,F403 \
            --exclude=venv,env,.venv,migrations,build,dist
          echo "Python linting completed."

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run JSHint Linter
        run: |
          echo "Running jshint on JavaScript files..."
          # Search more broadly (frontend + any JS in project)
          find . -name "*.js" -not -path "./frontend/node_modules/*" -not -path "./.git/*" \
            -exec jshint {} + || true
          echo "JavaScript linting completed (warnings allowed)."
